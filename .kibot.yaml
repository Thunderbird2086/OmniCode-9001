# KiPlot config file
kiplot:
  version: 1

global:
  resources_dir: '.resources'
  units: 'millimeters'

preflight:
  check_zone_fills: true
  run_drc: false
  update_xml: false

filters:
  - name: fix_offset
    comment: 'Adjust offset for JLC'
    type: rot_footprint
    negative_bottom: false
    mirror_bottom: true
    offsets:
      - ["^SW_MX_HS", "0,-1.27"]
  - name: fix_rotation
    comment: 'Adjust rotation for JLC'
    type: rot_footprint
    negative_bottom: false
    mirror_bottom: true

outputs:
  - name: 'gerbers'
    comment: "Gerbers for the board house"
    type: 'gerber'
    dir: 'gerber'
    options:
      # generic layer options
      exclude_edge_layer: false
      exclude_pads_from_silkscreen: false
      use_aux_axis_as_origin: false
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: true
      force_plot_invisible_refs_vals: false
      tent_vias: true
      # ignore_unconnected: true  # Moved here per deprecation warning

      # gerber options
      line_width: 0.15
      subtract_mask_from_silk: false
      use_protel_extensions: false
      gerber_precision: 4.6
      create_gerber_job_file: false
      use_gerber_x2_attributes: false
      use_gerber_net_attributes: false

    layers:
      - layer: 'F.Cu'
        suffix: 'F_Cu'
      - layer: 'F.Mask'
        suffix: 'F_Mask'
      - layer: 'F.Paste'
        suffix: 'F_Paste'
      - layer: 'F.SilkS'
        suffix: 'F_Silks'
      - layer: 'B.Cu'
        suffix: 'B_Cu'
      - layer: 'B.Mask'
        suffix: 'B_Mask'
      - layer: 'B.Paste'
        suffix: 'B_Paste'
      - layer: 'B.SilkS'
        suffix: 'B_Silks'
      - layer: 'Edge.Cuts'
        suffix: 'Edge_Cuts'

  - name: 'excellon_drill'
    comment: "Excellon drill files"
    type: 'excellon'
    dir: 'gerber'
    options:
      metric_units: true
      pth_and_npth_single_file: false
      use_aux_axis_as_origin: false
      minimal_header: false
      mirror_y_axis: false
      map:
        type: 'gerber'

  - name: 'bom'
    comment: "Bill of Materials"
    type: 'bom'
    dir: 'misc'
    options:
      output: '%f_%i_jlc.%x'
#      exclude_filter: 'only_jlc_parts'
      ref_separator: ','
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: _field_lcsc_part
          name: 'LCSC Part #'
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  - name: 'position'
    comment: "Position file (CPL) for pick and place"
    type: 'position'
    dir: 'misc'
    options:
      pre_transform: fix_rotation
      output: '%f_cpl_jlc.%x'
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: true
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer
